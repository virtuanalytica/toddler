name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,finance]"
      # Jev server tests: the web stack only (the `datasets` part of the jev extra is for calibration runs)
      - run: python -m pip install fastapi uvicorn httpx
      # learn tests need torch + gymnasium; the CPU wheel keeps CI small
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "gymnasium==1.2.1" "minigrid==3.1.0"
      # knitweb is optional here: tests that need it are skipped when it is absent.
      - run: python -m pytest -q
      - run: python scripts/validate_contribution.py --all
