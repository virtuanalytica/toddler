[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toddler"
version = "0.1.0"
description = "Toddler: governed learning agent (virtualpc + Alexander integration)"
requires-python = ">=3.11"
dependencies = ["numpy", "networkx>=3.2", "scikit-learn", "scipy", "requests"]

[project.optional-dependencies]
dev = ["pytest"]
aws = ["boto3"]
learn = ["torch", "gymnasium==1.2.1"]
grid = ["minigrid==3.1.0", "gymnasium==1.2.1"]   # same gymnasium pin as `learn`
gpu = ["nvidia-ml-py", "psutil"]
jev = ["fastapi", "uvicorn", "datasets"]

[tool.setuptools.packages.find]
include = ["toddler*", "jevserver*"]

[tool.pytest.ini_options]
pythonpath = ["."]
